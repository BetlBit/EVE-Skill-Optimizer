name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install Inno Setup 6
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build and test release
        shell: powershell
        run: .\build_release.ps1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EVE-Skill-Optimizer-Windows-${{ github.ref_name }}
          path: release/*
          if-no-files-found: error

      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/EVE-Skill-Optimizer-Setup-*.exe
            release/EVE-Skill-Optimizer-Portable-*.zip
            release/EVE-Skill-Optimizer-Source-*.zip
            release/SHA256SUMS.txt
